<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>러닝 기록 시스템</title>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      background: #f5f5f5; 
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .container { 
      max-width: 100%;
      max-height: 100vh;
      margin: 0 auto; 
      background: white; 
      padding: 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    h1 { 
      color: #4285F4; 
      text-align: center; 
      margin-bottom: 12px; 
      font-size: 24px;
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .session-info {
      background: #f0f7ff;
      border: 2px solid #4285F4;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #4285F4;
    }
    .session-info strong {
      font-size: 12px;
    }
    .mode-badge {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #2e7d32;
      font-weight: bold;
    }
    .mode-badge.max-distance {
      background: #fff3e0;
      border-color: #ff9800;
      color: #e65100;
    }
    .network-status {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 5px;
      display: inline-block;
    }
    .network-status.online {
      background: #d4edda;
      color: #155724;
    }
    .network-status.offline {
      background: #f8d7da;
      color: #721c24;
    }
    button.new-session-header {
      background: #ff9800;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 11px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }
    button.new-session-header:hover {
      background: #e68900;
    }
    .camera-section {
      position: relative;
      margin-bottom: 15px;
      background: #000;
      border: 2px solid #4285F4;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      width: 100%;
    }
    #video { 
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
      object-fit: cover;
      -webkit-transform: translate3d(0, 0, 0);
    }
    #canvas { display: none; }
    .camera-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    select {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      background: white;
      color: #333;
    }
    button { 
      background: #4285F4; 
      color: white;
      border: none; 
      padding: 8px 16px; 
      font-size: 13px; 
      border-radius: 5px; 
      cursor: pointer; 
      transition: background 0.3s;
      flex: 1;
      -webkit-user-select: none;
      user-select: none;
    }
    button:hover { background: #357ae8; }
    button:active { background: #2e5cc8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .message { 
      padding: 12px; 
      margin: 8px 0; 
      border-radius: 5px; 
      display: none;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      animation: slideIn 0.2s ease-out;
      position: fixed;
      top: 20px;
      left: 15px;
      right: 15px;
      z-index: 999;
      max-width: calc(100% - 30px);
      word-wrap: break-word;
      word-break: break-word;
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .message.show { display: block; }
    .success { 
      background: #d4edda; 
      border: 2px solid #28a745; 
      color: #155724;
    }
    .error { 
      background: #f8d7da; 
      border: 2px solid #f5c6cb; 
      color: #721c24;
    }
    .info { 
      background: #d1ecf1; 
      border: 2px solid #bee5eb; 
      color: #0c5460;
    }
    .stats { 
      background: #f0f7ff;
      border: 2px solid #4285F4;
      padding: 12px; 
      border-radius: 8px; 
      margin: 12px 0; 
      text-align: center; 
    }
    .stats h3 {
      color: #4285F4;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .stats p { 
      margin: 6px 0; 
      font-size: 13px; 
    }
    .stats strong { 
      color: #34A853; 
    }
    .section {
      background: #f9f9f9;
      border: 0.5px solid #e0e0e0;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .section h3 {
      color: #4285F4;
      margin-bottom: 8px;
      font-size: 14px;
    }
    button.batch-end {
      background: #f44336;
      width: 100%;
      margin-top: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    button.batch-end:hover {
      background: #da190b;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease-out;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 3px solid #4285F4;
      padding-bottom: 12px;
    }
    .modal-header h2 {
      color: #4285F4;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }
    .mode-btn {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      font-size: 12px;
    }
    .mode-btn:active {
      border-color: #4285F4;
      background: #f0f7ff;
    }
    .mode-btn.selected {
      border-color: #4285F4;
      background: #f0f7ff;
    }
    .mode-btn .emoji {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .input-group {
      margin: 12px 0;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #4285F4;
    }
    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 10px;
    }
    .modal-buttons button.cancel {
      background: #999;
    }
    .modal-buttons button.cancel:hover {
      background: #777;
    }
    .pace-end-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .pace-end-modal.show {
      display: flex;
    }
    .end-modal-content {
      background: white;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .end-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .end-title {
      font-size: 20px;
      color: #4285F4;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .end-time {
      font-size: 14px;
      color: #666;
      margin: 12px 0;
    }
    .end-time strong {
      font-size: 20px;
      color: #34A853;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏃 러닝 기록</h1>
  
  <div class="session-header">
    <div class="session-info">
      <strong>세션: <span id="sessionDisplay">준비중</span></strong>
    </div>
    <div class="mode-badge" id="modeBadge">준비중</div>
    <div class="network-status online" id="networkStatus">🟢 온라인</div>
    <button class="new-session-header" onclick="startNewSession()">🔄</button>
  </div>
  
  <div class="camera-section">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  
  <div class="camera-controls">
    <select id="cameraSelect">
      <option value="environment">후면 카메라</option>
      <option value="user">전면 카메라</option>
    </select>
  </div>
  
  <div class="button-group">
    <button id="startBtn" onclick="startCamera()">시작</button>
    <button id="stopBtn" onclick="stopCamera()" disabled>중지</button>
  </div>
  
  <div id="message" class="message"></div>
  
  <div id="stats" class="stats" style="display:none;">
    <h3>통계</h3>
    <p>스캔: <strong id="scanCount">0</strong>회</p>
    <p id="lastStudent" style="display:none;">학생: <strong id="lastName">-</strong></p>
    <p id="distanceInfo" style="display:none;">거리: <strong id="lastDistance">-</strong>km</p>
  </div>

  <div class="section">
    <button class="batch-end" id="batchEndBtn" onclick="batchEndSession()" style="display:none;">🛑 일괄 종료</button>
  </div>
</div>

<!-- 모드 선택 모달 -->
<div id="modeModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>운동 모드</h2>
      <p style="font-size: 12px;">모드를 선택하세요</p>
    </div>
    
    <div class="mode-buttons">
      <div class="mode-btn" id="maxDistanceBtn" onclick="selectMode('maxDistance')">
        <div class="emoji">📏</div>
        <strong>최대거리</strong>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">목표 거리<br>자동 종료</p>
      </div>
      <div class="mode-btn" id="freeBtn" onclick="selectMode('free')">
        <div class="emoji">🆓</div>
        <strong>자율</strong>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">거리 제한<br>없음</p>
      </div>
    </div>
    
    <div id="distanceInputGroup" class="input-group" style="display:none;">
      <label for="maxDistanceInput">목표 거리 (km):</label>
      <input type="number" id="maxDistanceInput" placeholder="예: 10" min="1" step="0.5">
    </div>
    
    <div class="modal-buttons">
      <button onclick="cancelModeSelect()" class="cancel">취소</button>
      <button id="confirmModeBtn" onclick="confirmMode()" disabled>확인</button>
    </div>
  </div>
</div>

<!-- 운동 종료 모달 -->
<div id="endModal" class="pace-end-modal">
  <div class="end-modal-content">
    <div class="end-icon">🏁</div>
    <div class="end-title">운동 종료!</div>
    <div class="end-time">
      <span id="endStudentName">-</span>
      <strong id="endTotalTime">00:00:00</strong>
    </div>
  </div>
</div>

<script>
  let video = document.getElementById('video');
  let canvas = document.getElementById('canvas');
  let canvasContext = canvas.getContext('2d');
  let scanning = false;
  let cameraStarted = false;
  let frameCount = 0;
  let lastQRData = null;
  let qrCooldown = false;
  let scanLoopInterval = null;
  
  // 메시지 큐
  let messageQueue = [];
  let messageDisplaying = false;
  
  // 세션 설정
  let currentSessionId = null;
  let sessionMode = null;
  let maxDistance = null;
  let endedStudents = {};
  
  // 네트워크
  let isOnline = navigator.onLine;

  // ================================================
  // 네트워크 상태
  // ================================================
  window.addEventListener('online', () => {
    isOnline = true;
    updateNetworkStatus();
    queueMessage('🟢 온라인', 'success');
  });

  window.addEventListener('offline', () => {
    isOnline = false;
    updateNetworkStatus();
    queueMessage('⚠️ 오프라인 모드', 'error');
  });

  function updateNetworkStatus() {
    const status = document.getElementById('networkStatus');
    if (isOnline) {
      status.className = 'network-status online';
      status.textContent = '🟢 온라인';
    } else {
      status.className = 'network-status offline';
      status.textContent = '⚠️ 오프라인';
    }
  }

  // ================================================
  // 메시지 큐
  // ================================================
  function queueMessage(msg, type) {
    messageQueue.push({msg, type});
    processMessageQueue();
  }

  function processMessageQueue() {
    if (messageDisplaying || messageQueue.length === 0) return;
    
    messageDisplaying = true;
    const {msg, type} = messageQueue.shift();
    
    const msgDiv = document.getElementById('message');
    msgDiv.textContent = msg;
    msgDiv.className = 'message show ' + type;
    
    setTimeout(() => {
      msgDiv.classList.remove('show');
      messageDisplaying = false;
      processMessageQueue();
    }, 2000);
  }

  function clearMessage() {
    const msgDiv = document.getElementById('message');
    msgDiv.classList.remove('show');
    messageQueue = [];
  }

  // ================================================
  // 통신 (재시도 로직)
  // ================================================
  async function fetchWithRetry(url, retries = 3) {
    for (let i = 0; i < retries; i++) {
      try {
        console.log(`📡 요청 시도 ${i + 1}/${retries}: ${url.substring(0, 50)}...`);
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);  // 8초 타임아웃
        
        const response = await fetch(url, {
          method: 'GET',
          signal: controller.signal,
          headers: {
            'Accept': 'application/json'
          }
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        console.log('✅ 응답 성공');
        return data;
        
      } catch (error) {
        console.error(`❌ 시도 ${i + 1} 실패:`, error.message);
        
        if (i === retries - 1) {
          throw error;
        }
        
        // 다음 시도 전 대기 (1초, 2초, 3초)
        await new Promise(resolve => setTimeout(resolve, (i + 1) * 1000));
      }
    }
  }

  // ================================================
  // 초기화
  // ================================================
  function init() {
    console.log('🚀 초기화 중...');
    
    updateNetworkStatus();
    
    currentSessionId = localStorage.getItem('currentSessionId');
    sessionMode = localStorage.getItem('sessionMode');
    maxDistance = localStorage.getItem('maxDistance');
    
    if (!currentSessionId || !sessionMode) {
      showModeModal();
    } else {
      displaySessionInfo();
      updateModeBadge();
    }
  }

  // ================================================
  // 모드 선택
  // ================================================
  let selectedMode = null;

  function showModeModal() {
    document.getElementById('modeModal').classList.add('show');
  }

  function selectMode(mode) {
    selectedMode = mode;
    
    document.getElementById('maxDistanceBtn').classList.remove('selected');
    document.getElementById('freeBtn').classList.remove('selected');
    
    if (mode === 'maxDistance') {
      document.getElementById('maxDistanceBtn').classList.add('selected');
      document.getElementById('distanceInputGroup').style.display = 'block';
    } else {
      document.getElementById('freeBtn').classList.add('selected');
      document.getElementById('distanceInputGroup').style.display = 'none';
    }
    document.getElementById('confirmModeBtn').disabled = false;
  }

  function confirmMode() {
    if (!selectedMode) {
      queueMessage('모드를 선택하세요', 'error');
      return;
    }
    
    if (selectedMode === 'maxDistance') {
      const distance = parseFloat(document.getElementById('maxDistanceInput').value);
      if (!distance || distance <= 0) {
        queueMessage('거리를 입력하세요', 'error');
        return;
      }
      maxDistance = distance;
      localStorage.setItem('maxDistance', maxDistance);
    }
    
    generateNewSessionId();
    sessionMode = selectedMode;
    localStorage.setItem('sessionMode', sessionMode);
    
    document.getElementById('modeModal').classList.remove('show');
    displaySessionInfo();
    updateModeBadge();
    queueMessage('✅ 준비 완료!', 'success');
  }

  function cancelModeSelect() {
    if (confirm('취소하시겠습니까?')) {
      document.getElementById('modeModal').classList.remove('show');
    }
  }

  function generateNewSessionId() {
    currentSessionId = 'SESSION_' + Date.now();
    localStorage.setItem('currentSessionId', currentSessionId);
    endedStudents = {};
  }

  function displaySessionInfo() {
    const dateObj = new Date(parseInt(currentSessionId.split('_')[1]));
    const timeStr = dateObj.toLocaleTimeString('ko-KR', {
      hour: '2-digit',
      minute: '2-digit'
    });
    document.getElementById('sessionDisplay').textContent = timeStr;
  }

  function updateModeBadge() {
    const badge = document.getElementById('modeBadge');
    if (sessionMode === 'maxDistance') {
      badge.className = 'mode-badge max-distance';
      badge.textContent = `📏 ${maxDistance}km`;
      document.getElementById('batchEndBtn').style.display = 'none';
    } else {
      badge.className = 'mode-badge';
      badge.textContent = '🆓 자율';
      document.getElementById('batchEndBtn').style.display = 'block';
    }
  }

  function startNewSession() {
    if (cameraStarted) {
      queueMessage('⚠️ 카메라 중지 후 진행', 'error');
      return;
    }
    
    if (confirm('새로 시작?')) {
      localStorage.clear();
      location.reload();
    }
  }

  // ================================================
  // 카메라
  // ================================================
  async function startCamera() {
    if (cameraStarted || !sessionMode) return;
    
    cameraStarted = true;
    
    try {
      const facingMode = document.getElementById('cameraSelect').value;
      const constraints = {
        video: { 
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };
      
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.style.display = 'block';
      
      await video.play();
      
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('cameraSelect').disabled = true;
      scanning = true;
      
      startScanLoop();
      queueMessage('✅ 스캔 시작', 'success');
      
    } catch (error) {
      console.error('카메라 오류:', error);
      queueMessage('❌ 카메라 오류', 'error');
      cameraStarted = false;
      document.getElementById('startBtn').disabled = false;
    }
  }

  function stopCamera() {
    const stream = video.srcObject;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    video.style.display = 'none';
    scanning = false;
    cameraStarted = false;
    
    if (scanLoopInterval) {
      clearInterval(scanLoopInterval);
      scanLoopInterval = null;
    }
    
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('cameraSelect').disabled = false;
    queueMessage('⏹️ 스캔 중지', 'info');
  }

  // ================================================
  // 스캔 루프
  // ================================================
  function startScanLoop() {
    if (scanLoopInterval) clearInterval(scanLoopInterval);
    
    scanLoopInterval = setInterval(() => {
      if (!scanning) return;
      
      try {
        frameCount++;
        
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          
          if (canvas.width === 0 || canvas.height === 0) return;
          
          canvasContext.drawImage(video, 0, 0);
          const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
          
          if (typeof jsQR === 'function') {
            const code = jsQR(imageData.data, canvas.width, canvas.height);
            
            if (code && !qrCooldown) {
              if (lastQRData === code.data) {
                return;
              }
              
              console.log('✅ QR:', code.data);
              lastQRData = code.data;
              qrCooldown = true;
              
              handleQRData(code.data);
            }
          }
        }
      } catch (e) {
        console.error('스캔 오류:', e);
      }
    }, 50);
  }

  // ================================================
  // QR 처리 (개선된 통신)
  // ================================================
  async function handleQRData(qrText) {
    scanning = false;
    
    try {
      if (endedStudents[qrText]) {
        queueMessage('❌ 이미 종료', 'error');
        resumeScanning();
        return;
      }
      
      queueMessage('⏳ 처리중...', 'info');
      
      const appScriptUrl = 'https://script.google.com/macros/s/AKfycbxC92EzuvA5WamPJ1yNwgFleCLgjSgoKdpUm3e-rkBjFawWqseG9hXZ0I7ePQwOa1sP/exec?qr=' + encodeURIComponent(qrText) + '&sessionId=' + encodeURIComponent(currentSessionId);
      
      console.log('📤 요청 시작');
      const result = await fetchWithRetry(appScriptUrl, 3);  // ← 재시도 로직!
      
      if (result.success) {
        const scanCount = result.data.accumulated.scanCount;
        const distance = result.data.accumulated.distance || 0;
        const totalTime = result.data.accumulated.totalTime || "00:00:00";
        const studentName = result.data.student.name;
        
        updateDisplay(result.data.student, distance, scanCount);
        
        if (scanCount === 1) {
          queueMessage('🏃 러닝 시작!', 'success');
        } else {
          queueMessage(`📍 라운드 ${scanCount}`, 'info');
        }
        
        if (sessionMode === 'maxDistance' && distance >= maxDistance) {
          endedStudents[qrText] = true;
          showEndModal(studentName, totalTime);
          resumeScanning();
          return;
        }
      } else {
        queueMessage(`❌ ${result.message}`, 'error');
      }
    } catch (error) {
      console.error('처리 오류:', error.message);
      queueMessage(`❌ 재시도 중...`, 'error');
    }
    
    resumeScanning();
  }

  function resumeScanning() {
    setTimeout(() => {
      lastQRData = null;
      qrCooldown = false;
      scanning = true;
    }, 300);
  }

  function updateDisplay(student, distance, scanCount) {
    document.getElementById('stats').style.display = 'block';
    document.getElementById('scanCount').textContent = scanCount;
    document.getElementById('lastStudent').style.display = 'block';
    document.getElementById('lastName').textContent = student.name;
    
    if (sessionMode === 'maxDistance') {
      document.getElementById('distanceInfo').style.display = 'block';
      document.getElementById('lastDistance').textContent = distance.toFixed(1);
    }
  }

  // ================================================
  // 모달
  // ================================================
  function showEndModal(studentName, totalTime) {
    document.getElementById('endStudentName').textContent = studentName;
    document.getElementById('endTotalTime').textContent = totalTime;
    
    const modal = document.getElementById('endModal');
    modal.classList.add('show');
    
    setTimeout(() => {
      modal.classList.remove('show');
    }, 3000);
  }

  function batchEndSession() {
    if (confirm('모든 학생 종료?')) {
      stopCamera();
      queueMessage('✅ 종료됨', 'success');
      
      setTimeout(() => {
        localStorage.clear();
        location.reload();
      }, 2000);
    }
  }

  // ================================================
  // 시작
  // ================================================
  init();
  
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(err => {
      console.log('Wake Lock 실패:', err);
    });
  }
</script>
